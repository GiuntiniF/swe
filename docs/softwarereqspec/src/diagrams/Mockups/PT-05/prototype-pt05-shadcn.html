  in basso (frecce o tasti ← →). La variante è nell'hash: #variante-a, #variante-b, #variante-c.

  Componenti: ricostruzioni HTML di shadcn/ui (Button, Card, Input, Table, Tabs, Badge,

<script>
/* ============================================================
   Dati d'esempio (gli stessi dei mockup Salt)
   ============================================================ */
const TODAY = "2026-11-26";
const ATHLETE = { name: "Mario Rossi", initials: "MR", email: "mario.rossi@mail.it", age: 27, height: 178, weight: 76, gyms: ["FitLab Pisa"] };
const APPOINTMENTS = [
  { date: "2026-12-02", time: "18:30", status: "Confermato" },
  { date: "2026-12-09", time: "18:30", status: "Richiesto" },
];
const PLANS = [
  { id: "forza-base", name: "Forza base", blocks: [4, 4] },
  { id: "ipertrofia-12", name: "Ipertrofia 12 settimane", blocks: [4, 4, 4] },
  { id: "mantenimento", name: "Mantenimento", blocks: [4] },
  { id: "forza-avanzata", name: "Forza avanzata", blocks: [4, 4, 4] },
  { id: "ipertrofia-invernale", name: "Ipertrofia invernale", blocks: [4, 4, 4] },
  { id: "ricomposizione", name: "Ricomposizione", blocks: [4], unconfigured: "Il blocco mensile 1 non ha sessioni di allenamento." },
];
const SESSIONS = [
  { id: "s1", name: "Sessione 1", focus: "Spinta e gambe", rows: [
    { id: "squat", name: "Squat", sets: "5 × 5", rest: "180 s" },
    { id: "panca", name: "Panca piana", sets: "4 × 6", rest: "150 s", drop: 0.7 },
    { id: "rematore", name: "Rematore con bilanciere", sets: "3 × 10", rest: "—", superset: "A" },
    { id: "lento", name: "Lento avanti", sets: "3 × 10", rest: "90 s", superset: "A" },
  ]},
  { id: "s2", name: "Sessione 2", focus: "Tirata", rows: [
    { id: "stacco", name: "Stacco da terra", sets: "5 × 3", rest: "180 s" },
    { id: "trazioni", name: "Trazioni zavorrate", sets: "4 × 6", rest: "120 s" },
  ]},
];
const EX_IDS = SESSIONS.flatMap(s => s.rows.map(r => r.id));
const BASE = { squat: 100, panca: 80, rematore: 60, lento: 40, stacco: 130, trazioni: 10 };

/* ============================================================
   Regole di dominio (PT-05)
   ============================================================ */
const plan = id => PLANS.find(p => p.id === id);
const weeksOf = p => p.blocks.reduce((a, b) => a + b, 0);
const key = (w, ex) => `${w}|${ex}`;
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const daysBetween = (a, b) => (new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000;
// Nota 3: la data di fine è l'ultimo giorno dell'ultimo blocco mensile.
const endOf = (planId, start) => addDays(start, weeksOf(plan(planId)) * 7 - 1);
const fmt = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : "—";
const fmtLong = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const kg = v => Number(v).toLocaleString("it-IT", { maximumFractionDigits: 1 });
function blockOfWeek(p, w) { let acc = 0; for (let i = 0; i < p.blocks.length; i++) { if (w <= acc + p.blocks[i]) return { block: i + 1, inBlock: w - acc }; acc += p.blocks[i]; } }
function weeksOfBlock(p, b) { const s = p.blocks.slice(0, b - 1).reduce((a, x) => a + x, 0); return Array.from({ length: p.blocks[b - 1] }, (_, i) => s + i + 1); }
function hasLoad(f, w, ex) { const v = f.loads[key(w, ex)]; return v !== undefined && v !== "" && !Number.isNaN(v); }
const missingInWeek = (f, w) => EX_IDS.filter(ex => !hasLoad(f, w, ex)).length;
function incompleteWeeks(f) { const W = weeksOf(plan(f.planId)); return Array.from({ length: W }, (_, i) => i + 1).filter(w => missingInWeek(f, w) > 0); }
function totals(f) { const W = weeksOf(plan(f.planId)); let filled = 0; for (let w = 1; w <= W; w++) filled += EX_IDS.length - missingInWeek(f, w); return { filled, total: W * EX_IDS.length }; }
// Nota 2: un solo carico; la discesa del drop-set usa il moltiplicatore della variante.
const dropValue = (f, w, row) => hasLoad(f, w, row.id) ? Math.round(f.loads[key(w, row.id)] * row.drop * 2) / 2 : null;
// Nota 5: il controllo di sovrapposizione considera solo le assegnazioni confermate.
function overlapFor(start, end, excludeId) {
  return S.assignments.find(a => a.status === "confirmed" && a.id !== excludeId && a.start <= end && start <= endOf(a.planId, a.start));
}
function firstFreeDay() {
  const last = S.assignments.filter(a => a.status === "confirmed").map(a => endOf(a.planId, a.start)).sort().pop();
  const d = addDays(last, 1); return d < TODAY ? TODAY : d;
}
// Nota 1: ogni sessione è precompilata con i carichi della stessa sessione nella week precedente.
function prefillWeek(f, w, exIds = EX_IDS) {
  if (w <= 1) return 0; let n = 0;
  for (const ex of exIds) if (!hasLoad(f, w, ex) && hasLoad(f, w - 1, ex)) { f.loads[key(w, ex)] = f.loads[key(w - 1, ex)]; f.pre.add(key(w, ex)); n++; }
  return n;
}
function weekRanges(ws) {
  const out = []; let s = null, p = null;
  for (const w of ws) { if (s === null) { s = p = w; } else if (w === p + 1) { p = w; } else { out.push([s, p]); s = p = w; } }
  if (s !== null) out.push([s, p]);
  return out.map(([a, b]) => a === b ? `Week ${a}` : `Week ${a}–${b}`).join(", ");
}
function periodStatus(a) { const e = endOf(a.planId, a.start); return TODAY < a.start ? "Programmata" : TODAY > e ? "Terminata" : "In corso"; }

function genLoads(weeks, partial = {}) {
  const L = {};
  for (let w = 1; w <= weeks; w++) for (const ex of EX_IDS) L[key(w, ex)] = BASE[ex] + Math.floor((w - 1) / 2) * 2.5;
  for (const [w, exs] of Object.entries(partial)) for (const ex of EX_IDS) if (!exs.includes(ex)) delete L[key(w, ex)];
  return L;
}
function initialAssignments() {
  const draft = genLoads(4, { 4: ["squat", "panca"] });
  return [
    { id: 1, planId: "forza-base", start: "2026-01-05", status: "confirmed", loads: genLoads(8) },
    { id: 2, planId: "ipertrofia-12", start: "2026-03-02", status: "confirmed", loads: genLoads(12) },
    { id: 3, planId: "mantenimento", start: "2026-11-09", status: "confirmed", loads: genLoads(4) },
    { id: 4, planId: "ipertrofia-invernale", start: "2027-03-01", status: "draft", loads: draft },
  ];
}

/* ============================================================
   Stato (solo in memoria)
   ============================================================ */
const S = {
  variant: 0,
  assignments: initialAssignments(),
  nextId: 5,
  flow: null,
  ui: {},
  dialog: null,
  toast: null,
  showState: false,
};
const newFlow = () => ({ id: null, planId: null, start: "", loads: {}, pre: new Set(), showErrors: false, error: null, notice: null, week: 1, session: "s1", resumed: false });
function flowFromDraft(a) {
  const f = { ...newFlow(), id: a.id, planId: a.planId, start: a.start, loads: { ...a.loads }, showErrors: true, resumed: true };
  f.week = incompleteWeeks(f)[0] || 1;
  return f;
}
function resetUi() { S.flow = null; S.ui = { aView: "detail", bSheet: false, bPhase: "setup", bTab: "schede", cOpen: false, doneId: null, highlight: null }; }
resetUi();

function upsertDraft() {
  const f = S.flow; let a = S.assignments.find(x => x.id === f.id);
  if (!a) { a = { id: S.nextId++, status: "draft" }; S.assignments.push(a); f.id = a.id; }
  Object.assign(a, { planId: f.planId, start: f.start, loads: { ...f.loads } });
  return a;
}
// Passo 6: il sistema crea l'assegnazione in bozza (vedi il diagramma di sequenza PT-05 Assegnazione).
function continueToLoads() {
  const f = S.flow; const o = overlapFor(f.start, endOf(f.planId, f.start), f.id);
  if (o) { f.error = { type: "overlap", with: o.id }; return false; }
  f.error = null; upsertDraft(); f.week = incompleteWeeks(f)[0] || 1; return true;
}
function saveDraft() {
  upsertDraft(); S.ui.highlight = S.flow.id; V().leave();
  toast("Bozza salvata", "La trovi tra le schede di Mario Rossi. Puoi riprenderla quando vuoi.");
}
function submit() {
  const f = S.flow; f.showErrors = true;
  const miss = incompleteWeeks(f);
  if (miss.length) { upsertDraft(); f.error = { type: "missing", weeks: miss }; render(); return; }
  const o = overlapFor(f.start, endOf(f.planId, f.start), f.id);
  if (o) { upsertDraft(); f.error = { type: "overlap-confirm", with: o.id }; render(); return; }
  const a = upsertDraft(); a.status = "confirmed"; f.error = null; S.ui.highlight = a.id;
  V().done(a);
}

/* ============================================================
   Componenti shadcn/ui (stesse classi della libreria)
   ============================================================ */
const cx = (...a) => a.filter(Boolean).join(" ");
const icon = (n, c = "") => `<i data-lucide="${n}" class="${c}"></i>`;
const BTN = "inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 [&_svg]:size-4 [&_svg]:shrink-0";
const BTN_V = {
  default: "bg-primary text-primary-foreground shadow hover:bg-primary/90",
  destructive: "bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90",
  outline: "border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground",
  secondary: "bg-secondary text-secondary-foreground shadow-sm hover:bg-secondary/80",
  ghost: "hover:bg-accent hover:text-accent-foreground",
  link: "text-primary underline-offset-4 hover:underline px-0",
};
const BTN_S = { default: "h-9 px-4 py-2", sm: "h-8 rounded-md px-3 text-xs", lg: "h-10 rounded-md px-8", icon: "h-9 w-9", "icon-sm": "h-7 w-7" };
function Button(label, { v = "default", s = "default", action, data = {}, ic, icr, disabled, cls = "", title } = {}) {
  const d = Object.entries(data).map(([k, x]) => ` data-${k}="${x}"`).join("");
  return `<button type="button" class="${cx(BTN, BTN_V[v], BTN_S[s], cls)}"${action ? ` data-action="${action}"` : ""}${d}${disabled ? " disabled" : ""}${title ? ` title="${title}" aria-label="${title}"` : ""}>${ic ? icon(ic) : ""}${label}${icr ? icon(icr) : ""}</button>`;
}
const BADGE_V = {
  default: "border-transparent bg-primary text-primary-foreground shadow",
  secondary: "border-transparent bg-secondary text-secondary-foreground",
  outline: "text-foreground",
  destructive: "border-transparent bg-destructive/15 text-destructive",
  success: "border-transparent bg-success/15 text-success",
  warning: "border-transparent bg-warning/15 text-warning",
};
const Badge = (t, v = "default", ic) => `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-md border px-2 py-0.5 text-xs font-semibold [&_svg]:size-3 ${BADGE_V[v]}">${ic ? icon(ic) : ""}${t}</span>`;
const Card = (inner, cls = "") => `<div class="rounded-xl border bg-card text-card-foreground shadow ${cls}">${inner}</div>`;
const CardHeader = (title, desc = "", right = "") => `<div class="flex flex-wrap items-start justify-between gap-3 p-6"><div class="flex min-w-0 flex-col gap-1.5"><h3 class="font-semibold leading-none tracking-tight">${title}</h3>${desc ? `<p class="text-sm text-muted-foreground">${desc}</p>` : ""}</div>${right}</div>`;
const CardContent = (x, cls = "") => `<div class="p-6 pt-0 ${cls}">${x}</div>`;
const CardFooter = (x, cls = "") => `<div class="flex flex-wrap items-center gap-2 p-6 pt-0 ${cls}">${x}</div>`;
const Separator = (cls = "") => `<div role="separator" class="h-px w-full shrink-0 bg-border ${cls}"></div>`;
const Label = (t, forId) => `<label ${forId ? `for="${forId}"` : ""} class="text-sm font-medium leading-none">${t}</label>`;
const INPUT = "flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm";
function Alert(title, desc, { v = "default", ic = "info", actions = "" } = {}) {
  const vc = v === "destructive" ? "border-destructive/50 text-destructive [&>svg]:text-destructive"
    : v === "success" ? "border-success/50 text-success [&>svg]:text-success"
    : "bg-background text-foreground";
  return `<div role="alert" class="relative w-full rounded-lg border px-4 py-3 text-sm [&>svg]:absolute [&>svg]:left-4 [&>svg]:top-4 [&>svg]:size-4 [&>svg~*]:pl-7 ${vc}">${icon(ic)}<div><h5 class="mb-1 font-medium leading-none tracking-tight">${title}</h5><div class="text-sm opacity-90 [&_p]:leading-relaxed">${desc}</div>${actions ? `<div class="mt-3 flex flex-wrap gap-2">${actions}</div>` : ""}</div></div>`;
}
const Progress = pct => `<div class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div data-live="progress-bar" class="h-full bg-primary transition-all" style="width:${pct}%"></div></div>`;
const Avatar = (t, cls = "size-10") => `<span class="relative flex shrink-0 items-center justify-center overflow-hidden rounded-full bg-muted font-medium ${cls}">${t}</span>`;
function Tabs(items, current, action, cls = "") {
  return `<div role="tablist" class="inline-flex h-9 max-w-full items-center overflow-x-auto rounded-lg bg-muted p-1 text-muted-foreground ${cls}">${items.map(it =>
    `<button type="button" role="tab" data-action="${action}" data-id="${it.id}" data-state="${String(it.id) === String(current) ? "active" : "inactive"}" class="inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow">${it.label}${it.extra || ""}</button>`).join("")}</div>`;
}
const TH = "h-10 px-2 text-left align-middle font-medium text-muted-foreground whitespace-nowrap";
const TD = "p-2 align-middle";
const TR = "border-b transition-colors hover:bg-muted/50";
function Breadcrumb(items) {
  return `<nav aria-label="breadcrumb"><ol class="flex flex-wrap items-center gap-1.5 text-sm text-muted-foreground">${items.map((it, i) => {
    const last = i === items.length - 1;
    return `<li class="inline-flex items-center">${last ? `<span class="text-foreground">${it.label}</span>` : `<button type="button" class="transition-colors hover:text-foreground" ${it.action ? `data-action="${it.action}"` : ""}>${it.label}</button>`}</li>${last ? "" : `<li role="presentation" class="[&>svg]:size-3.5">${icon("chevron-right")}</li>`}`;
  }).join("")}</ol></nav>`;
}
function AppHeader() {
  return `<header class="mb-6 border-b"><div class="mx-auto flex h-14 max-w-6xl items-center gap-6">
    <div class="flex items-center gap-2 font-semibold">${icon("dumbbell", "size-5")}<span>Area PT</span></div>
    <nav class="hidden items-center gap-5 text-sm sm:flex">${["Atleti", "Schede", "Palestre", "Appuntamenti"].map(n => `<span class="${n === "Atleti" ? "font-medium text-foreground" : "text-muted-foreground"}">${n}</span>`).join("")}</nav>
    <div class="ml-auto">${Avatar("PT", "size-8 text-xs")}</div></div></header>`;
}

/* Frammenti di dominio riusati dalle varianti */
const periodBadge = a => { const s = periodStatus(a); return Badge(s, s === "In corso" ? "success" : s === "Terminata" ? "secondary" : "outline"); };
const draftBadge = a => a.status === "draft" ? Badge("Bozza", "warning", "pencil") : "";
const sorted = () => [...S.assignments].sort((a, b) => a.start.localeCompare(b.start));
const planSub = p => `${p.blocks.length} ${p.blocks.length === 1 ? "blocco mensile" : "blocchi mensili"} · ${weeksOf(p)} settimane`;
function loadInput(f, w, ex, cls = "w-20 text-right") {
  const k = key(w, ex); const has = hasLoad(f, w, ex);
  return `<input id="load-${S.variant}-${w}-${ex}" data-load="${k}" type="number" inputmode="decimal" step="0.5" min="0" aria-label="Carico in kg" value="${has ? f.loads[k] : ""}" placeholder="kg"
    class="${cx(INPUT, "h-8 tabular", cls, f.pre.has(k) && "italic text-muted-foreground", !has && f.showErrors && "border-destructive bg-destructive/5")}">`;
}
function weekStatus(f, w, mode = "badge") {
  const m = missingInWeek(f, w);

  if (m === 0) return Badge("Completa", "success", "check");
  if (m === EX_IDS.length) return Badge("Da compilare", f.showErrors ? "destructive" : "outline");
  return Badge(`${m} ${m === 1 ? "mancante" : "mancanti"}`, f.showErrors ? "destructive" : "warning");
}

    if (S.flow && S.flow.id === id) V().leave();
    toast("Bozza scartata", `"${name}" e i suoi carichi sono stati eliminati.`);
  },
  "set-start": d => { S.flow.start = d.d; S.flow.error = null; },
  "save-draft": () => saveDraft(),
  "submit": () => submit(),
  "toast-close": () => { S.toast = null; },
  "proto-prev": () => setVariant((S.variant + VARIANTS.length - 1) % VARIANTS.length),
  "proto-next": () => setVariant((S.variant + 1) % VARIANTS.length),
  "proto-state": () => { S.showState = !S.showState; },
  "proto-reset": () => { S.assignments = initialAssignments(); S.nextId = 5; S.dialog = null; S.toast = null; resetUi(); },
  // A
  "a-detail": () => { S.flow = null; S.ui.aView = "detail"; },
  "a-new": () => { S.flow = newFlow(); S.ui.highlight = null; S.ui.aView = "plans"; },
  "a-plans": () => { S.ui.aView = "plans"; },
  "a-pick": d => { const p = plan(d.id); if (p.unconfigured) { S.flow.notice = p.id; return; } S.flow.notice = null; S.flow.planId = p.id; S.ui.aView = "dates"; },
  "a-dates": () => { S.flow.error = null; S.ui.aView = "dates"; },
  "a-continue": () => { if (continueToLoads()) S.ui.aView = "loads"; },
  "a-block": d => { const p = plan(S.flow.planId); S.flow.week = weeksOfBlock(p, +d.id)[0]; prefillWeek(S.flow, S.flow.week); },
  "a-week": d => { S.flow.week = +d.id; prefillWeek(S.flow, S.flow.week); },
  // B
  "b-tab": d => { S.ui.bTab = d.id; },
  "b-open": () => { S.flow = newFlow(); S.ui.highlight = null; S.ui.bSheet = true; S.ui.bPhase = "setup"; },
  "b-close": () => { S.flow = null; S.ui.bSheet = false; },
  "b-pick": d => { const p = plan(d.id); if (p.unconfigured) { S.flow.notice = p.id; return; } if (S.flow.resumed) return; S.flow.notice = null; S.flow.planId = p.id; },
  "b-continue": () => { if (continueToLoads()) S.ui.bPhase = "loads"; },
  "b-setup": () => { S.flow.error = null; S.ui.bPhase = "setup"; },
  "b-week": d => { const w = +d.id; S.flow.week = S.flow.week === w ? 0 : w; if (S.flow.week) prefillWeek(S.flow, w); },
  // C
  "c-open": () => { S.flow = newFlow(); S.ui.highlight = null; S.ui.cOpen = true; },
  "c-close": () => { S.flow = null; S.ui.cOpen = false; },
  "c-bar": d => {
    const a = S.assignments.find(x => x.id === +d.id); if (!a) return;
    if (a.status === "draft") { VC.resume(a); } else ACT["open-plan"]();
  },
  "c-session": d => { S.flow.session = d.id; },
  "c-prefill": () => { const f = S.flow; const ids = SESSIONS.find(s => s.id === f.session).rows.map(r => r.id); for (let w = 2; w <= weeksOf(plan(f.planId)); w++) prefillWeek(f, w, ids); },
  "c-propagate": d => { const f = S.flow; for (let w = 2; w <= weeksOf(plan(f.planId)); w++) prefillWeek(f, w, [d.id]); },
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.action]; if (!fn) return;
  fn(el.dataset, el); render();
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.load || !S.flow) return;
  const [w, ex] = el.dataset.load.split("|"); const k = key(w, ex);
  S.flow.loads[k] = el.value === "" ? "" : Number(el.value); S.flow.pre.delete(k);
  el.classList.remove("italic", "text-muted-foreground");
  if (el.value !== "") el.classList.remove("border-destructive", "bg-destructive/5");
  updateLive();
});
document.addEventListener("change", e => {
  const el = e.target; if (!S.flow || !el.dataset) return;
  if (el.dataset.field === "start") { S.flow.start = el.value; S.flow.error = null; render(); }
  if (el.dataset.field === "plan") {
    const p = plan(el.value);
    if (p && p.unconfigured) { S.flow.notice = p.id; }
    else { S.flow.notice = null; S.flow.planId = el.value || null; S.flow.loads = {}; S.flow.pre = new Set(); }
    render();
  }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Escape") { if (S.dialog) S.dialog = null; else if (S.showState) S.showState = false; else if (S.ui.bSheet) ACT["b-close"](); else return; render(); return; }
  if (t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") ACT["proto-prev"]();
  if (e.key === "ArrowRight") ACT["proto-next"]();
});

/* Variante nell'hash (#variante-a). Accetta anche ?variant=B quando il file è aperto in locale. */
function setVariant(i) { const slug = VARIANTS[i].slug; if (location.hash.slice(1) !== slug) location.hash = slug; else applyRoute(); }
function applyRoute() {
  const h = location.hash.slice(1); let i = VARIANTS.findIndex(v => v.slug === h);
  if (i < 0) { const q = new URLSearchParams(location.search).get("variant"); i = Math.max(0, VARIANTS.findIndex(v => v.key === (q || "A").toUpperCase())); }
  if (i !== S.variant) { S.variant = i; resetUi(); }
  render();
}
window.addEventListener("hashchange", applyRoute);
applyRoute();
</script>
