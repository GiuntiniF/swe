[project]
name = "swe-domain"
version = "0.1.0"
description = "Script di supporto alla SRS (export dei diagrammi Gaphor)"
# Gaphor 3.3 non supporta ancora Python 3.15.
requires-python = ">=3.14,<3.15"
dependencies = [
    # Lo script usa gaphor.diagram.export.render(with_diagram_type=...),
    # API interna: meglio non salire di versione minore senza riprovarlo.
    "gaphor>=3.3.2,<3.4",
    "pycairo>=1.22",
]

[tool.uv]
package = false
